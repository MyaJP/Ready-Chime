name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.loader }} ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, mc: '1.21.1' }
          - { loader: fabric, mc: '1.21.2' }
          - { loader: fabric, mc: '1.21.3' }
          - { loader: fabric, mc: '1.21.4' }
          - { loader: fabric, mc: '1.21.5' }
          - { loader: fabric, mc: '1.21.6' }
          - { loader: fabric, mc: '1.21.7' }
          - { loader: fabric, mc: '1.21.8' }
          - { loader: fabric, mc: '1.21.9' }
          - { loader: fabric, mc: '1.21.10' }
          - { loader: fabric, mc: '1.21.11' }
          - { loader: fabric, mc: '26.1' }
          - { loader: fabric, mc: '26.1.1' }
          - { loader: fabric, mc: '26.1.2' }
          - { loader: fabric, mc: '26.2' }
          - { loader: fabric, mc: '26.3' }
          - { loader: neoforge, mc: '1.21.1' }
          - { loader: neoforge, mc: '1.21.3' }
          - { loader: neoforge, mc: '1.21.4' }
          - { loader: neoforge, mc: '1.21.5' }
          - { loader: neoforge, mc: '1.21.8' }
          - { loader: neoforge, mc: '1.21.10' }
          - { loader: neoforge, mc: '1.21.11' }
          - { loader: neoforge, mc: '26.1.2' }
          - { loader: neoforge, mc: '26.2' }
          - { loader: neoforge, mc: '26.3' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Each project compiles for its own Java via toolchains; this only picks the JVM that runs Gradle
      # (Fabric Loom 1.19 and NeoForge on 26.x want 25).
      - name: Pick the Java that runs Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ matrix.loader }}
        run: |
          chmod +x gradlew
          ./gradlew -p '${{ matrix.mc }}' build --stacktrace

      - name: Collect jar
        run: |
          mkdir -p out
          find '${{ matrix.loader }}/${{ matrix.mc }}/build/libs' -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev*.jar' ! -name '*-slim.jar' \
            -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}-${{ matrix.mc }}
          path: out/*.jar
          if-no-files-found: error

  dist:
    name: Push jars to the dist branch
    needs: build
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Commit the latest jars to the dist branch
        run: |
          cd jars
          sha256sum *.jar > SHA256SUMS
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jars built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist

